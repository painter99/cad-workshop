name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate specs
        run: python tools/validate_spec.py

      - name: Run test suite
        run: pytest

      - name: Render previews
        run: |
          python tools/render_preview.py exports/test_block.stl exports/test_block

      - name: Upload exports and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-exports
          path: |
            exports/*.stl
            exports/*.step
            exports/*.png
          if-no-files-found: error
