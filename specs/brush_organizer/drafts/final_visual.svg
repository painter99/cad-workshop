  <linearGradient id="paste" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b0e5d0"/><stop offset="1" stop-color="#4c9c7e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-30%" width="150%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
