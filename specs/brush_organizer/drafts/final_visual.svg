 <text x="155" y="845" font-family="sans-serif" font-size="34" fill="#433d34" font-weight="600">Koncepční vizualizace — organizér s pomůckami</text>
 <text x="155" y="892" font-family="sans-serif" font-size="23" fill="#696257">Vektorová ilustrace podle aktuálního rozměrového modelu; doplňky jsou schematické, nikoli výrobní díly.</text>
 <text x="155" y="936" font-family="sans-serif" font-size="20" fill="#847d71">Pasty v krajních Ø35 • hranaté / zaoblené kartáčky v obdélnících • dětské kulaté rukojeti ve válcích • 4 rohové nožičky</text>
</svg>