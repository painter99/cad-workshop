part: brush_organizer
description: >
  Desk organizer for brushes (kartacky) and pastes. A 250x55x35 block standing
  on 4 corner legs (5 mm tall), with six pockets of varying shape and depth on
  the top face; every pocket floor is an X of two diagonal ribs spanning the
  full height from the block bottom to the pocket floor (crosses sit at the
  lowest point of the block), quarter sectors open through to the bottom.
  Transcribed from a hand sketch and corrected by the owner in chat (2026-10-19):
  rectangular pockets are 12x15 mm, 30 mm deep, centered in Y; legs are only
  the 4 corner ones, pushed almost flush into the corners; X ribs in ALL
  pockets, reaching the block bottom (chosen variant A direction, corrected).
units: mm
drawing: generated   # dimensioned drawing generated from this spec (visuals/drawing.png); hand sketch kept private by owner decision

dimensions:
  length: 250            # X
  width: 55              # Y (depth)
  height: 35             # block only; +5 mm legs => total 40
  leg_height: 5
  leg_diameter: 5

features:
  # Six pockets, evenly spaced along X; centers moved inward by 5/3/1 mm
  # respectively to give equal 7.5 mm end walls and a uniform 40 mm pitch.
  # x = -100, -60, -20, +20, +60, +100 (even 40 mm pitch; end wall 7.5 mm); all centered in Y.
  pockets:
    - id: P1
      shape: circle
      diameter: 35
      depth: 15
      x_position: -100
    - id: P2
      shape: slot
      along_x: 15        # 15 mm along the block ("15 mm na delku")
      along_y: 12        # 12 mm across the block ("12 mm na sirku") - VETO?
      depth: 30
      x_position: -60
    - id: P3
      shape: slot
      along_x: 15
      along_y: 12
      depth: 30
      x_position: -20
    - id: P4
      shape: circle
      diameter: 22
      depth: 30
      x_position: 20
    - id: P5
      shape: circle
      diameter: 30
      depth: 30
      x_position: 60
    - id: P6
      shape: circle
      diameter: 35
      depth: 15
      x_position: 100

  # X-fill, CHOSEN by the owner (2026-10-19): variant A direction, corrected -
  # the pocket floor IS an X of two diagonal ribs (4 mm wide) that span the
  # FULL height from the block bottom face up to the pocket floor, so the
  # crosses sit at the LOWEST point of the block (not recessed). The four
  # quarter sectors stay OPEN through to the bottom face. Applied to ALL
  # six pockets, incl. the shallow 35 mm ones (his explicit request).
  # (The cradle alternative - solid floor + 3 mm X ridge - was not chosen;
  # web_thickness below is kept only for that unused style.)
  x_fill:
    style: web_floor
    under: all
    rib_width: 4
    rib_embed: 2         # each rib end extends 2 mm into the wall for a solid union
    web_thickness: 3     # cradle-style ridge height only (unused)

  # owner's corrections: only the 4 corner legs; pushed almost flush into the
  # corners for stability (leg edge 2.5 mm from the block edge).
  legs:
    count: 4
    height: 5
    inset: 5              # leg CENTER distance from the block edges

tolerance: 0.2
assumptions:       # explicit, veto-friendly (one-parameter changes)
  - slot orientation: 12 mm across the block (Y) x 15 mm along it (X) - VETO?
  - "X ribs span the full under-region height (bottom -> pocket floor); the owner
    offered a cheaper 5-10 mm cross at the bottom, rejected - it would turn
    the shallow 15 mm pockets into ~25-30 mm deep ones"
  - each rib end embedded 2 mm into the wall (rib_embed) for a solid union
  - leg inset 5 mm from edges (leg edge 2.5 mm from the block edge) - stability per the owner
