part: brush_organizer
description: >
  Desk organizer for brushes (kartacky) and pastes. A 250x55x35 block standing
  on 6 legs (5 mm tall), with six pockets of varying shape and depth on the
  top face; under every pocket an X-shaped semi-open web instead of a solid
  floor. Transcribed from a hand sketch and APPROVED by Pavel in chat
  (2026-10-19), including the stated assumptions below.
units: mm
drawing: pending   # sketch photos not yet stored in repo

dimensions:
  length: 250            # X
  width: 55              # Y (depth)
  height: 35             # block only; +5 mm legs => total 40
  leg_height: 5
  leg_diameter: 5

features:
  # Six pockets, evenly spaced along X (approved proposal):
  # x = -105, -63, -21, +21, +63, +105; all centered in Y.
  pockets:
    - id: P1
      shape: circle
      diameter: 35
      depth: 15
      x_position: -105
    - id: P2
      shape: slot
      width: 12           # along X
      length: 30          # along Y - ASSUMPTION (not dimensioned in sketch)
      depth: 30
      x_position: -63
    - id: P3
      shape: slot
      width: 15
      length: 30          # ASSUMPTION
      depth: 30
      x_position: -21
    - id: P4
      shape: circle
      diameter: 22
      depth: 30
      x_position: 21
    - id: P5
      shape: circle
      diameter: 30
      depth: 30
      x_position: 63
    - id: P6
      shape: circle
      diameter: 35
      depth: 15
      x_position: 105

  # Approved interpretation: under EVERY pocket the floor is not solid -
  # an X-shaped web (two diagonal ribs, 4 mm wide, 3 mm thick) spanning the
  # pocket, the four quarter sectors left OPEN through to the bottom face.
  x_fill:
    under: all_pockets
    rib_width: 4
    web_thickness: 3
    open_quarters: true

  # Approved layout: 4 legs near the corners + 2 at mid-length,
  # inset 15 mm from the edges.
  legs:
    count: 6
    height: 5
    inset: 15

tolerance: 0.2
assumptions:       # explicit, veto-friendly (one-parameter changes)
  - slot length along Y = 30 mm (sketch does not dimension it)
  - X-web under all six pockets incl. the shallow end pockets
  - leg inset 15 mm from edges
